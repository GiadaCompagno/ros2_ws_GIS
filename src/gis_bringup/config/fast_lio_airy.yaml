/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 3
        filter_size_surf: 0.3
        filter_size_map: 0.3
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"
        common:
            lid_topic: "/rslidar_points"
            imu_topic: "/rslidar_imu_data"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0
        preprocess:
            lidar_type: 2
            scan_line: 96
            scan_rate: 10
            timestamp_unit: 0        # time in secondi
            blind: 0.5
        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 100.0
            extrinsic_est_en: false
            extrinsic_T: [0.00418, 0.00427, -0.00444]
            extrinsic_R: [0.000926, -1.0, 0.000235, -0.999993, -0.000925, 0.003543, -0.003543, -0.000238, -0.999994]
        publish:
            path_en: true
            scan_publish_en: true
            dense_publish_en: true
            scan_bodyframe_pub_en: true
        pcd_save:
            pcd_save_en: true
            interval: -1